<!DOCTYPE html>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fef5f8 0%, #f0e6f0 50%, #e8d5e8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Swan Lake - Multiple elegant swans */
        body::before {
            content: '🦢';
            position: fixed;
            font-size: 180px;
            opacity: 0.06;
            right: -40px;
            top: 10%;
            transform: rotate(-20deg);
            pointer-events: none;
            z-index: 0;
        }
        
        body::after {
            content: '🦢';
            position: fixed;
            font-size: 220px;
            opacity: 0.05;
            left: -60px;
            bottom: 5%;
            transform: rotate(15deg) scaleX(-1);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        /* Third swan for Swan Lake scene */
        .container::before {
            content: '🦢';
            position: fixed;
            font-size: 150px;
            opacity: 0.04;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) rotate(-5deg);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            background: white;
            border-radius: 25px;
            padding: 30px 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(155, 89, 182, 0.15);
            position: relative;
        }

        h1 {
            color: #FF6B9D;
            font-size: 2.5em;
            text-align: center;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .heart {
            color: #9B59B6;
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .subtitle {
            text-align: center;
            color: #9B59B6;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .flirty-message {
            background: linear-gradient(135deg, #FFE5EC, #FFF0F5);
            border: 2px solid rgba(221, 160, 221, 0.5);
            border-radius: 20px;
            padding: 15px 20px;
            margin: 15px 0;
            color: #9B59B6;
            text-align: center;
            font-weight: 600;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.5s;
        }

        .flirty-message.show {
            opacity: 1;
            max-height: 150px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            gap: 15px;
        }

        .stat {
            text-align: center;
            flex: 1;
            background: rgba(155, 89, 182, 0.08);
            padding: 12px;
            border-radius: 15px;
        }

        .stat-number {
            font-size: 2em;
            font-weight: 700;
            color: #9B59B6;
        }

        .stat-label {
            font-size: 0.9em;
            color: #6C5B7B;
            margin-top: 5px;
        }

        .level-filter,
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: white;
            padding: 12px;
            border-radius: 20px;
            overflow-x: auto;
            box-shadow: 0 5px 20px rgba(155, 89, 182, 0.1);
            -webkit-overflow-scrolling: touch;
        }
        
        .level-filter::-webkit-scrollbar,
        .nav-tabs::-webkit-scrollbar {
            height: 5px;
        }
        
        .level-filter::-webkit-scrollbar-thumb,
        .nav-tabs::-webkit-scrollbar-thumb {
            background: rgba(155, 89, 182, 0.3);
            border-radius: 10px;
        }

        .level-btn,
        .tab-btn {
            flex: 0 0 auto;
            padding: 12px 22px;
            border: 2px solid #DDA0DD;
            border-radius: 15px;
            background: white;
            color: #9B59B6;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .level-btn.active,
        .tab-btn.active {
            background: linear-gradient(135deg, #9B59B6, #BA55D3);
            color: white;
            border-color: #9B59B6;
        }

        .content-area {
            display: none;
        }

        .content-area.active {
            display: block;
        }

        .card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(155, 89, 182, 0.12);
            min-height: 450px;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .category-badge {
            background: rgba(155, 89, 182, 0.15);
            color: #9B59B6;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .word-type {
            background: rgba(221, 160, 221, 0.2);
            color: #6C5B7B;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.8em;
        }

        .word-main {
            font-size: 3em;
            font-weight: 700;
            color: #FF6B9D;
            text-align: center;
            margin: 40px 0;
        }

        .word-translation {
            font-size: 1.8em;
            color: #9B59B6;
            text-align: center;
            opacity: 0;
            transition: all 0.4s;
            margin: 30px 0;
        }

        .word-translation.show {
            opacity: 1;
        }

        .example-sentence {
            background: #F8F9FA;
            padding: 20px;
            border-radius: 15px;
            border-left: 4px solid #DDA0DD;
            margin-top: auto;
            font-style: italic;
            color: #555;
            line-height: 1.6;
        }

        .sentence-container {
            font-size: 1.4em;
            color: #333;
            margin: 30px 0;
            text-align: center;
            padding: 25px;
            background: #F8F9FA;
            border-radius: 18px;
        }

        .target-sentence {
            font-size: 1.4em;
            font-weight: 600;
            color: #9B59B6;
            text-align: center;
            padding: 25px;
            background: #F8F9FA;
            border-radius: 18px;
            margin-bottom: 25px;
            border: 2px dashed #DDA0DD;
        }

        .building-area {
            min-height: 140px;
            background: #F8F9FA;
            border: 3px dashed #DDA0DD;
            border-radius: 20px;
            padding: 25px;
            margin: 25px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .placeholder-text {
            width: 100%;
            text-align: center;
            color: rgba(155, 89, 182, 0.4);
            margin: auto;
        }

        .building-area.has-words .placeholder-text {
            display: none;
        }

        .word-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 25px 0;
        }

        .word-chip {
            padding: 14px 24px;
            background: white;
            border: 3px solid #DDA0DD;
            border-radius: 25px;
            font-weight: 600;
            color: #9B59B6;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(147, 112, 219, 0.1);
        }

        .word-chip.used {
            opacity: 0.3;
        }

        .word-chip.selected {
            background: linear-gradient(135deg, #9B59B6, #BA55D3);
            color: white;
        }
        
        .word-chip.correct {
            background: #4CAF50;
            color: white;
        }
        
        .word-chip.wrong {
            background: #f44336;
            color: white;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 30px 0;
        }

        .quiz-option {
            padding: 18px 25px;
            background: white;
            border: 3px solid #DDA0DD;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .quiz-option.correct {
            background: #E8F5E9;
            border-color: #4CAF50;
            color: #2E7D32;
        }

        .quiz-option.wrong {
            background: #FFEBEE;
            border-color: #f44336;
            color: #C62828;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: auto;
            padding-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 18px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #9B59B6, #BA55D3);
            color: white;
        }

        .btn-secondary {
            background: white;
            color: #9B59B6;
            border: 2px solid #DDA0DD;
        }

        .feedback {
            margin-top: 20px;
            padding: 18px;
            border-radius: 15px;
            text-align: center;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s;

            opacity: 1;
            max-height: 200px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(221, 160, 221, 0.3);
            border-radius: 10px;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #9B59B6, #BA55D3);
            border-radius: 10px;
            transition: width 0.5s;

            padding: 60px 20px;
            font-size: 1.5em;
            color: #9B59B6;

</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Hey İrem <span class="heart">💜</span></h1>
            <p class="subtitle">Your personal English learning journey</p>
            <div id="flirty-message" class="flirty-message"></div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-number" id="totalWords">985</div>
                    <div class="stat-label">Words</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="score">0</div>
                    <div class="stat-label">Score</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="streak">0</div>
                    <div class="stat-label">Streak 🔥</div>
                </div>
            </div>
        </div>

        <div class="level-filter">
            <button class="level-btn active" onclick="filterLevel('ALL')">All Levels</button>
            <button class="level-btn" onclick="filterLevel('A1')">A1 Beginner</button>
            <button class="level-btn" onclick="filterLevel('A2')">A2 Elementary</button>
            <button class="level-btn" onclick="filterLevel('B1')">B1 Intermediate</button>
            <button class="level-btn" onclick="filterLevel('B2')">B2 Upper-Int</button>
            <button class="level-btn" onclick="filterLevel('C1')">C1 Advanced</button>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('flashcards')">📚 Flashcards</button>
            <button class="tab-btn" onclick="switchTab('fillblank')">📝 Fill Blanks</button>
            <button class="tab-btn" onclick="switchTab('build')">🧩 Build Sentence</button>
            <button class="tab-btn" onclick="switchTab('quiz')">🎯 Quiz</button>
        </div>

        <div id="loading" class="loading">
            <p>Loading vocabulary... 📖</p>
        </div>

        <!-- Flashcards -->
        <div id="flashcards" class="content-area" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <span class="category-badge" id="fc-category"></span>
                    <span class="word-type" id="fc-type"></span>
                </div>
                
                <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                    <div class="word-main" id="fc-word"></div>
                    <div class="word-translation" id="fc-translation"></div>
                </div>
                
                <div class="example-sentence" id="fc-example"></div>
                
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="showTranslation()">👁️ Show Translation</button>
                    <button class="btn btn-primary" onclick="nextFlashcard()">Next ➡️</button>
                </div>
            </div>
        </div>

        <!-- Fill Blank -->
        <div id="fillblank" class="content-area" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <span class="category-badge" id="fb-level"></span>
                    <div class="progress-bar" style="width: 100px; margin: 0;">
                        <div class="progress-fill" id="fb-progress" style="width: 0%"></div>
                    </div>
                </div>
                
                <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                    <p style="color: #6C5B7B; font-size: 0.95em; margin-bottom: 30px; text-align: center;">
                        👉 Tap the correct word to complete the sentence
                    </p>
                    
                    <div id="fb-sentence-display" style="
                        font-size: 1.5em;
                        line-height: 2;
                        text-align: center;
                        color: #333;
                        font-weight: 500;
                        margin-bottom: 40px;
                    "></div>
                    
                    <div class="word-options" id="fb-options" style="max-width: 400px;"></div>
                </div>
                
                <div class="btn-group" style="margin-top: auto;">
                    <button class="btn btn-primary" onclick="nextFillBlank()" style="width: 100%;">Next Question ➡️</button>
                </div>
                
                <div class="feedback" id="fb-feedback"></div>
            </div>
        </div>

        <!-- Build Sentence -->
        <div id="build" class="content-area" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <span class="category-badge" id="bs-level"></span>
                    <div class="progress-bar" style="width: 100px; margin: 0;">
                        <div class="progress-fill" id="bs-progress" style="width: 0%"></div>
                    </div>
                </div>
                
                <div style="text-align: center; margin-bottom: 20px;">
                    <p style="color: #6C5B7B; font-size: 1em; font-weight: 600;">🇹🇷 Türkçe cümleyi İngilizce yap</p>
                    <p style="color: #999; font-size: 0.9em;">Translate the Turkish sentence to English</p>
                </div>
                
                <div class="target-sentence" id="bs-turkish" style="font-size: 1.3em; color: #C06C84;"></div>
                
                <div style="flex: 1;">
                    <div class="building-area" id="bs-area">
                        <div class="placeholder-text">Tap words below to build the English sentence</div>
                    </div>
                </div>
                
                <div class="word-options" id="bs-options"></div>
                
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="clearSentence()">🔄 Clear</button>
                    <button class="btn btn-secondary" onclick="checkSentence()">✓ Check</button>
                    <button class="btn btn-primary" onclick="nextBuildSentence()">Next ➡️</button>
                </div>
                
                <div class="feedback" id="bs-feedback"></div>
            </div>
        </div>

        <!-- Quiz -->
        <div id="quiz" class="content-area" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <span class="category-badge" id="q-level"></span>
                    <div class="progress-bar" style="width: 100px; margin: 0;">
                        <div class="progress-fill" id="q-progress" style="width: 0%"></div>
                    </div>
                </div>
                
                <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                    <div class="word-main" id="q-word"></div>
                </div>
                
                <div class="quiz-options" id="q-options"></div>
                
                <div class="btn-group" id="q-next-container" style="display: none;">
                    <button class="btn btn-primary" onclick="nextQuiz()" id="q-next">Next ➡️</button>
                </div>
            </div>
        </div>
    </div>

            const message = messages[Math.floor(Math.random() * messages.length)];

        // Check if user missed a day
        function checkLastVisit() {
            const lastVisit = localStorage.getItem('lastVisit');
            const today = new Date().toDateString();
            const sessionCount = parseInt(localStorage.getItem('sessionCount') || '0');
            
            if (lastVisit && lastVisit !== today) {
                const lastDate = new Date(lastVisit);
                const currentDate = new Date();
                const diffTime = Math.abs(currentDate - lastDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays >= 1) {
                    setTimeout(() => showFlirtyMessage('missedDay', 6000), 1000);
                }
            } else if (!lastVisit || sessionCount === 0) {
                // First time visitor
                setTimeout(() => showFlirtyMessage('firstTime', 6000), 500);
            } else {
                // Same day visit
                setTimeout(() => showFlirtyMessage('welcome', 5000), 500);
            }
            
            localStorage.setItem('lastVisit', today);
            localStorage.setItem('sessionCount', (sessionCount + 1).toString());
        }

            if (hour >= 22 || hour <= 5) {

            } else if (hour >= 6 && hour <= 11) {
                setTimeout(() => showFlirtyMessage('morningTime', 5000), 8000);
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('flashcards').classList.add('active');
            document.getElementById('flashcards').style.display = 'block';
            
            updateStats();
            loadFlashcard();
            
            // Check last visit and show welcome message
            checkLastVisit();
            checkTimeOfDay();
        }
        
        // Embedded data as fallback
        function loadEmbeddedData() {
            // This will be populated with the actual data
            fetch('comprehensive_vocabulary.json')
                .then(r => r.json())
                .then(data => {
                    vocabulary = data.vocabulary;
                    fillBlanks = data.fillBlanks;
                    buildSentences = data.buildSentences;
                })
                .catch(err => {
                    // If both fail, show basic demo data
                    vocabulary = [
                        {"word": "hello", "translation": "merhaba", "type": "interjection", "category": "Greetings", "example": "Hello, how are you?", "level": "A1"},
                        {"word": "goodbye", "translation": "hoşça kal", "type": "interjection", "category": "Greetings", "example": "Goodbye, see you later!", "level": "A1"},
                        {"word": "thank you", "translation": "teşekkür ederim", "type": "phrase", "category": "Greetings", "example": "Thank you for your help!", "level": "A1"}
                    ];
                    fillBlanks = [
                        {"sentence": "I say ___ when I meet someone.", "answer": "hello", "options": ["hello", "goodbye", "sorry", "please"], "level": "A1"}
                    ];
                    buildSentences = [
                        {"target": "Hello how are you", "words": ["Hello", "how", "are", "you", "goodbye", "I"], "level": "A1"}
                    ];
                    console.warn('Using demo data. Please ensure comprehensive_vocabulary.json is available.');
                });
        }

        function applyLevelFilter() {
            // Apply filter AND randomize!
            if (currentLevel === 'ALL') {
                filteredVocabulary = vocabulary;
                filteredFillBlanks = fillBlanks;
                filteredBuildSentences = buildSentences;
            } else {
                filteredVocabulary = vocabulary.filter(w => w.level === currentLevel);
                filteredFillBlanks = fillBlanks.filter(fb => fb.level === currentLevel);
                filteredBuildSentences = buildSentences.filter(bs => bs.level === currentLevel);
            }
            
            // Reset indices
            state.currentFlashcard = 0;
            state.currentFillBlank = 0;
            state.currentBuildSentence = 0;
            state.currentQuiz = 0;
        }

        function filterLevel(level) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            applyLevelFilter();
            
            // Reload current view
            const activeTab = document.querySelector('.tab-btn.active').textContent;
            if (activeTab.includes('Flashcards')) loadFlashcard();
            else if (activeTab.includes('Fill')) loadFillBlank();
            else if (activeTab.includes('Build')) loadBuildSentence();
            else if (activeTab.includes('Quiz')) loadQuiz();
        }

        function updateStats() {
            document.getElementById('totalWords').textContent = vocabulary.length;
            document.getElementById('score').textContent = state.score;
            document.getElementById('streak').textContent = state.streak;
        }

        function switchTab(tab) {
            // Hide ALL content areas first
            // RANDOMIZE content every time user switches tabs!
            filteredVocabulary = shuffleArray(filteredVocabulary);
            filteredFillBlanks = shuffleArray(filteredFillBlanks);
            filteredBuildSentences = shuffleArray(filteredBuildSentences);
            
            // Reset to first item
            state.currentFlashcard = 0;
            state.currentFillBlank = 0;
            state.currentBuildSentence = 0;
            state.currentQuiz = 0;
            
            document.querySelectorAll('.content-area').forEach(area => {
                area.classList.remove('active');
                area.style.display = 'none';
            });
            
            // Remove active from all tabs
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            // Show only the selected tab
            const selectedArea = document.getElementById(tab);
            selectedArea.classList.add('active');
            selectedArea.style.display = 'block';
            event.target.classList.add('active');

            // Load content for the tab
            if (tab === 'fillblank') loadFillBlank();
            if (tab === 'build') loadBuildSentence();
            if (tab === 'quiz') loadQuiz();
            if (tab === 'flashcards') loadFlashcard();
        }

        // Flashcards
        function loadFlashcard() {
            if (filteredVocabulary.length === 0) return;
            const word = filteredVocabulary[state.currentFlashcard % filteredVocabulary.length];
            document.getElementById('fc-category').textContent = word.category;
            document.getElementById('fc-type').textContent = word.type;
            document.getElementById('fc-word').textContent = word.word;
            document.getElementById('fc-translation').textContent = word.translation;
            document.getElementById('fc-example').textContent = word.example;
            document.getElementById('fc-translation').classList.remove('show');
        }

        function showTranslation() {
            document.getElementById('fc-translation').classList.add('show');
        }

        function nextFlashcard() {
            state.currentFlashcard = (state.currentFlashcard + 1) % filteredVocabulary.length;
            loadFlashcard();
        }

        // Fill in the Blank - NEW SIMPLE VERSION
        function loadFillBlank() {
            if (filteredFillBlanks.length === 0) {
                document.getElementById('fb-sentence-display').innerHTML = '<p style="color: #ff6b6b;">No exercises available for this level.</p>';
                return;
            }
            
            state.fillBlankAnswer = null;
            state.fillBlankAnswered = false;
            document.getElementById('fb-feedback').classList.remove('show');
            
            const exercise = filteredFillBlanks[state.currentFillBlank % filteredFillBlanks.length];
            const progress = ((state.currentFillBlank / filteredFillBlanks.length) * 100).toFixed(0);
            document.getElementById('fb-progress').style.width = progress + '%';
            document.getElementById('fb-level').textContent = `${exercise.level} - ${state.currentFillBlank + 1}/${filteredFillBlanks.length}`;
            
            // Display sentence with blank as ___
            const sentenceDisplay = exercise.sentence.replace('___', '<span style="color: #FF6B9D; font-weight: 700; text-decoration: underline; text-decoration-style: dashed; text-underline-offset: 5px;">___</span>');
            document.getElementById('fb-sentence-display').innerHTML = sentenceDisplay;
            
            // Create clickable word options
            const optionsHTML = exercise.options.map(opt => 
                `<div class="word-chip" onclick="answerFillBlank(this, '${opt}', '${exercise.answer}')">${opt}</div>`
            ).join('');
            document.getElementById('fb-options').innerHTML = optionsHTML;
        }

        // Answer immediately when word is clicked
        function answerFillBlank(element, selected, correct) {
            if (state.fillBlankAnswered) return; // Prevent multiple clicks
            
            state.fillBlankAnswered = true;
            state.fillBlankAnswer = selected;
            
            // Disable all other options
            document.querySelectorAll('#fb-options .word-chip').forEach(chip => {
                chip.style.pointerEvents = 'none';
                chip.style.opacity = '0.4';
            });
            
            const feedback = document.getElementById('fb-feedback');
            const exercise = filteredFillBlanks[state.currentFillBlank % filteredFillBlanks.length];
            
            if (selected === correct) {
                // CORRECT!
                element.classList.add('correct');
                element.style.opacity = '1';
                element.style.transform = 'scale(1.1)';
                
                // Update sentence with correct answer
                const sentenceDisplay = exercise.sentence.replace('___', `<span style="color: #2E7D32; font-weight: 700;">${selected}</span>`);
                document.getElementById('fb-sentence-display').innerHTML = sentenceDisplay;
                
                feedback.textContent = '🎉 Perfect! That\'s correct!';
                feedback.style.background = 'linear-gradient(135deg, #E8F5E9, #C8E6C9)';
                feedback.style.color = '#2E7D32';
                feedback.classList.add('show');
                
                state.score += 10;
                state.streak += 1;
                state.correctAnswersInSession += 1;
                
                setTimeout(() => showFlirtyMessage('afterCorrect', 4000), 1000);
                
                if (state.correctAnswersInSession > 0 && state.correctAnswersInSession % 5 === 0) {
                    setTimeout(() => showFlirtyMessage('highScore', 5000), 6000);
                }
            } else {
                // WRONG
                element.classList.add('wrong');
                element.style.opacity = '1';
                
                // Show correct answer
                document.querySelectorAll('#fb-options .word-chip').forEach(chip => {
                    if (chip.textContent === correct) {
                        chip.classList.add('correct');
                        chip.style.opacity = '1';
                        chip.style.transform = 'scale(1.05)';
                    }
                });
                
                // Update sentence with correct answer
                const sentenceDisplay = exercise.sentence.replace('___', `<span style="color: #C62828; font-weight: 700; text-decoration: line-through;">${selected}</span> → <span style="color: #2E7D32; font-weight: 700;">${correct}</span>`);
                document.getElementById('fb-sentence-display').innerHTML = sentenceDisplay;
                
                feedback.textContent = `The correct answer is "${correct}"`;
                feedback.style.background = 'linear-gradient(135deg, #FFEBEE, #FFCDD2)';
                feedback.style.color = '#C62828';
                feedback.classList.add('show');
                
                state.streak = 0;
                
                setTimeout(() => showFlirtyMessage('afterWrong', 4000), 1000);
            }
            
            updateStats();
        }

        function selectOption(element, word) {
            // This function is no longer used but kept for compatibility
        }

        function selectBlank(element) {}

        function checkFillBlank() {
            // No longer needed - answering happens immediately
        }

        function nextFillBlank() {
            state.currentFillBlank = (state.currentFillBlank + 1) % filteredFillBlanks.length;
            loadFillBlank();
        }

        // Build Sentence
        function loadBuildSentence() {
            if (filteredBuildSentences.length === 0) {
                document.getElementById('bs-turkish').innerHTML = 'No exercises available for this level.';
                return;
            }
            
            state.builtWords = [];
            document.getElementById('bs-feedback').classList.remove('show');
            
            const exercise = filteredBuildSentences[state.currentBuildSentence % filteredBuildSentences.length];
            const progress = ((state.currentBuildSentence / filteredBuildSentences.length) * 100).toFixed(0);
            document.getElementById('bs-progress').style.width = progress + '%';
            document.getElementById('bs-level').textContent = `${exercise.level} - ${state.currentBuildSentence + 1}/${filteredBuildSentences.length}`;
            
            // Show Turkish sentence
            document.getElementById('bs-turkish').textContent = '🇹🇷 ' + exercise.turkish;
            
            const buildingArea = document.getElementById('bs-area');
            buildingArea.innerHTML = '<div class="placeholder-text">Tap words below to build the English sentence</div>';
            buildingArea.classList.remove('has-words');
            
            // Create word chips from the English sentence (shuffled)
            const words = exercise.english.split(' ');
            const shuffledWords = [...words].sort(() => Math.random() - 0.5);
            
            const optionsHTML = shuffledWords.map((word, idx) => 
                `<div class="word-chip" data-word="${word}" data-idx="${idx}" onclick="addWordToSentence(this)">${word}</div>`
            ).join('');
            document.getElementById('bs-options').innerHTML = optionsHTML;
        }

        function addWordToSentence(element) {
            if (element.classList.contains('used')) return;
            
            const word = element.dataset.word;
            const idx = element.dataset.idx;
            
            state.builtWords.push({ word, idx });
            element.classList.add('used');
            
            const buildingArea = document.getElementById('bs-area');
            
            if (state.builtWords.length === 1) {
                buildingArea.innerHTML = '';
                buildingArea.classList.add('has-words');
            }
            
            const chip = document.createElement('div');
            chip.className = 'word-chip';
            chip.textContent = word;
            chip.onclick = () => removeWordFromSentence(chip, idx);
            buildingArea.appendChild(chip);
        }

        function removeWordFromSentence(chip, idx) {
            state.builtWords = state.builtWords.filter(w => w.idx !== idx);
            chip.remove();
            
            const option = document.querySelector(`#bs-options .word-chip[data-idx="${idx}"]`);
            option.classList.remove('used');
            
            const buildingArea = document.getElementById('bs-area');
            if (state.builtWords.length === 0) {
                buildingArea.innerHTML = '<div class="placeholder-text">Tap words below to build the sentence</div>';
                buildingArea.classList.remove('has-words');
            }
        }

        function clearSentence() {
            state.builtWords = [];
            document.querySelectorAll('#bs-options .word-chip').forEach(chip => chip.classList.remove('used'));
            const buildingArea = document.getElementById('bs-area');
            buildingArea.innerHTML = '<div class="placeholder-text">Tap words below to build the sentence</div>';
            buildingArea.classList.remove('has-words');
        }

        function checkSentence() {
            if (state.builtWords.length === 0 || filteredBuildSentences.length === 0) return;
            
            const exercise = filteredBuildSentences[state.currentBuildSentence % filteredBuildSentences.length];
            const built = state.builtWords.map(w => w.word).join(' ');
            const feedback = document.getElementById('bs-feedback');
            
            // Compare with English translation
            if (built === exercise.english) {
                feedback.textContent = '🎉 Perfect! You translated it correctly!';
                feedback.style.background = 'linear-gradient(135deg, #E8F5E9, #C8E6C9)';
                feedback.style.color = '#2E7D32';
                state.score += 15;
                state.streak += 1;
                state.correctAnswersInSession += 1;
                
                setTimeout(() => showFlirtyMessage('afterCorrect', 4000), 1000);
                
                if (state.correctAnswersInSession > 0 && state.correctAnswersInSession % 5 === 0) {
                    setTimeout(() => showFlirtyMessage('celebration', 5000), 6000);
                }
            } else {
                feedback.innerHTML = `❌ Not quite right.<br>Your answer: "${built}"<br>Correct answer: "${exercise.english}"`;
                feedback.style.background = 'linear-gradient(135deg, #FFEBEE, #FFCDD2)';
                feedback.style.color = '#C62828';
                state.streak = 0;
                
                setTimeout(() => showFlirtyMessage('afterWrong', 4000), 1000);
            }
            
            feedback.classList.add('show');
            updateStats();
        }

        function nextBuildSentence() {
            state.currentBuildSentence = (state.currentBuildSentence + 1) % filteredBuildSentences.length;
            loadBuildSentence();
        }

        // Quiz
        function loadQuiz() {
            if (filteredVocabulary.length === 0) return;
            
            state.quizAnswered = false;
            document.getElementById('q-next-container').style.display = 'none';
            
            const word = filteredVocabulary[state.currentQuiz % filteredVocabulary.length];
            const progress = ((state.currentQuiz / filteredVocabulary.length) * 100).toFixed(0);
            document.getElementById('q-progress').style.width = progress + '%';
            document.getElementById('q-level').textContent = `${word.level} - ${state.currentQuiz + 1}/${filteredVocabulary.length}`;
            document.getElementById('q-word').textContent = word.word;
            
            const options = [word.translation];
            const sameLevelWords = filteredVocabulary.filter(w => w.word !== word.word);
            while (options.length < 4 && sameLevelWords.length >= 3) {
                const randomWord = sameLevelWords[Math.floor(Math.random() * sameLevelWords.length)];
                if (!options.includes(randomWord.translation)) {
                    options.push(randomWord.translation);
                }
            }
            options.sort(() => Math.random() - 0.5);
            
            const optionsHTML = options.map(opt => 
                `<div class="quiz-option" onclick="checkQuizAnswer(this, '${opt}', '${word.translation}')">${opt}</div>`
            ).join('');
            document.getElementById('q-options').innerHTML = optionsHTML;
        }

        function checkQuizAnswer(element, selected, correct) {
            if (state.quizAnswered) return;
            
            state.quizAnswered = true;
            
            if (selected === correct) {
                element.classList.add('correct');
                state.score += 10;
                state.streak += 1;
                state.correctAnswersInSession += 1;
                
                setTimeout(() => showFlirtyMessage('afterCorrect', 4000), 800);
                
                if (state.streak >= 5) {
                    setTimeout(() => showFlirtyMessage('highScore', 5000), 5000);
                }
            } else {
                element.classList.add('wrong');
                document.querySelectorAll('.quiz-option').forEach(opt => {
                    if (opt.textContent === correct) {
                        opt.classList.add('correct');
                    }
                });
                state.streak = 0;
                
                setTimeout(() => showFlirtyMessage('afterWrong', 4000), 800);
            }
            
            updateStats();
            document.getElementById('q-next-container').style.display = 'flex';
        }

        function nextQuiz() {
            state.currentQuiz = (state.currentQuiz + 1) % filteredVocabulary.length;
            loadQuiz();
        }

        // Initialize
        loadData();
        
        // Show encouragement messages periodically
        setInterval(() => {
            if (Math.random() < 0.3) { // 30% chance every interval
                showFlirtyMessage('encouragement', 5000);
            }
        }, 60000); // Every minute
    </script>
</body>
</html>
