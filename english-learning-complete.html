<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hey İrem 💜</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #FF6B9D 0%, #C06C84 50%, #6C5B7B 100%);
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #FF6B9D;
            font-size: 2.5em;
            text-align: center;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .heart {
            color: #9B59B6;
            font-size: 1.2em;
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
        }

        .subtitle {
            text-align: center;
            color: #6C5B7B;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .flirty-message {
            background: linear-gradient(135deg, #FFE5EC, #FFF0F5);
            border: 2px solid #FF6B9D;
            border-radius: 20px;
            padding: 15px 20px;
            margin: 15px 0;
            text-align: center;
            color: #C06C84;
            font-size: 1em;
            font-weight: 600;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.5s ease;
            max-height: 0;
            overflow: hidden;
        }

        .flirty-message.show {
            opacity: 1;
            transform: translateY(0);
            max-height: 100px;
            margin: 15px 0;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            gap: 10px;
        }

        .stat {
            text-align: center;
            flex: 1;
            background: linear-gradient(135deg, #FFE5EC, #FFF0F5);
            padding: 12px;
            border-radius: 15px;
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: 700;
            color: #FF6B9D;
        }

        .stat-label {
            font-size: 0.8em;
            color: #6C5B7B;
            margin-top: 5px;
        }

        .level-filter {
            display: flex;
            gap: 8px;
            margin: 15px 0;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .level-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            font-family: 'Fredoka', sans-serif;
        }

        .level-btn.active {
            background: white;
            color: #FF6B9D;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            flex-shrink: 0;
            padding: 12px 20px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: white;
            color: #FF6B9D;
            transform: scale(1.05);
        }

        .content-area {
            display: none;
        }

        .content-area.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: white;
            border-radius: 25px;
            padding: 30px 25px;
            margin-bottom: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .word-main {
            font-size: 3em;
            font-weight: 700;
            color: #FF6B9D;
            text-align: center;
            margin: 30px 0;
            text-transform: capitalize;
            line-height: 1.2;
        }

        .word-translation {
            font-size: 1.5em;
            color: #6C5B7B;
            text-align: center;
            opacity: 0;
            transition: all 0.3s;
            transform: translateY(-10px);
            margin: 20px 0;
        }

        .word-translation.show {
            opacity: 1;
            transform: translateY(0);
        }

        .word-type, .category-badge {
            display: inline-block;
            padding: 5px 15px;
            background: linear-gradient(135deg, #FFE5EC, #FFF0F5);
            border-radius: 15px;
            font-size: 0.85em;
            color: #FF6B9D;
            margin: 5px;
        }

        .example-sentence {
            background: linear-gradient(135deg, #F8F9FA, #F0F0F0);
            padding: 20px;
            border-radius: 15px;
            border-left: 4px solid #FF6B9D;
            margin-top: auto;
            font-style: italic;
            color: #555;
            font-size: 1.05em;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 20px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF6B9D, #C06C84);
            color: white;
        }

        .btn-secondary {
            background: white;
            color: #FF6B9D;
            border: 2px solid #FF6B9D;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .sentence-container {
            font-size: 1.4em;
            line-height: 2;
            color: #333;
            margin: 30px 0;
            text-align: center;
            padding: 20px;
            background: #F8F9FA;
            border-radius: 15px;
        }

        .blank {
            display: inline-block;
            min-width: 100px;
            padding: 5px 15px;
            border-bottom: 3px dashed #FF6B9D;
            margin: 0 5px;
            text-align: center;
            color: #FF6B9D;
            font-weight: 700;
        }

        .blank.filled {
            background: linear-gradient(135deg, #FFE5EC, #FFF0F5);
            border-radius: 10px;
            border-bottom: none;
        }

        .blank.correct {
            background: linear-gradient(135deg, #C8E6C9, #E8F5E9);
            color: #2E7D32;
            animation: pulse 0.5s;
        }

        .blank.wrong {
            background: linear-gradient(135deg, #FFCDD2, #FFEBEE);
            color: #C62828;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .word-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        .word-chip {
            padding: 12px 20px;
            background: white;
            border: 2px solid #FF6B9D;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            color: #FF6B9D;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }

        .word-chip:active {
            transform: scale(0.9);
        }

        .word-chip.used {
            opacity: 0.3;
            pointer-events: none;
        }

        .word-chip.selected {
            background: linear-gradient(135deg, #FF6B9D, #C06C84);
            color: white;
            transform: scale(1.05);
        }

        .building-area {
            min-height: 120px;
            background: linear-gradient(135deg, #F8F9FA, #FFFFFF);
            border: 3px dashed #FF6B9D;
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-start;
            align-content: flex-start;
        }

        .building-area.has-words {
            border-style: solid;
        }

        .building-area .word-chip {
            background: linear-gradient(135deg, #FFE5EC, #FFF0F5);
            position: relative;
        }

        .building-area .word-chip::after {
            content: '×';
            position: absolute;
            top: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            background: #FF6B9D;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
        }

        .target-sentence {
            background: linear-gradient(135deg, #E8EAF6, #F3E5F5);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            color: #6C5B7B;
            font-size: 1.1em;
            font-weight: 600;
        }

        .placeholder-text {
            color: #999;
            text-align: center;
            font-style: italic;
            width: 100%;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .quiz-option {
            padding: 18px;
            background: white;
            border: 3px solid #E0E0E0;
            border-radius: 20px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            color: #333;
        }

        .quiz-option:active {
            transform: scale(0.98);
        }

        .quiz-option.correct {
            background: linear-gradient(135deg, #C8E6C9, #E8F5E9);
            border-color: #4CAF50;
            color: #2E7D32;
        }

        .quiz-option.wrong {
            background: linear-gradient(135deg, #FFCDD2, #FFEBEE);
            border-color: #F44336;
            color: #C62828;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 10px;
            transition: width 0.3s;
        }

        .feedback {
            background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: 600;
            color: #2E7D32;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: bounceIn 0.5s;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        @media (max-width: 480px) {
            .word-main {
                font-size: 2.2em;
            }
            
            .sentence-container {
                font-size: 1.2em;
                padding: 15px;
            }
            
            .card {
                padding: 25px 20px;
                min-height: 450px;
            }
            
            .word-translation {
                font-size: 1.3em;
            }
            
            .btn-group {
                flex-direction: row;
                gap: 8px;
            }
            
            .btn {
                font-size: 0.95em;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Hey İrem <span class="heart">💜</span></h1>
            <p class="subtitle">Your personal English learning journey</p>
            <div id="flirty-message" class="flirty-message"></div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-number" id="totalWords">824</div>
                    <div class="stat-label">Words</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="score">0</div>
                    <div class="stat-label">Score</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="streak">0</div>
                    <div class="stat-label">Streak 🔥</div>
                </div>
            </div>
        </div>

        <div class="level-filter">
            <button class="level-btn active" onclick="filterLevel('ALL')">All Levels</button>
            <button class="level-btn" onclick="filterLevel('A1')">A1 Beginner</button>
            <button class="level-btn" onclick="filterLevel('A2')">A2 Elementary</button>
            <button class="level-btn" onclick="filterLevel('B1')">B1 Intermediate</button>
            <button class="level-btn" onclick="filterLevel('B2')">B2 Upper-Int</button>
            <button class="level-btn" onclick="filterLevel('C1')">C1 Advanced</button>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('flashcards')">📚 Flashcards</button>
            <button class="tab-btn" onclick="switchTab('fillblank')">📝 Fill Blanks</button>
            <button class="tab-btn" onclick="switchTab('build')">🧩 Build Sentence</button>
            <button class="tab-btn" onclick="switchTab('quiz')">🎯 Quiz</button>
        </div>

        <div id="loading" class="loading">
            <p>Loading vocabulary... 📖</p>
        </div>

        <!-- Flashcards -->
        <div id="flashcards" class="content-area" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <span class="category-badge" id="fc-category"></span>
                    <span class="word-type" id="fc-type"></span>
                </div>
                
                <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                    <div class="word-main" id="fc-word"></div>
                    <div class="word-translation" id="fc-translation"></div>
                </div>
                
                <div class="example-sentence" id="fc-example"></div>
                
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="showTranslation()">👁️ Show Translation</button>
                    <button class="btn btn-primary" onclick="nextFlashcard()">Next ➡️</button>
                </div>
            </div>
        </div>

        <!-- Fill Blank -->
        <div id="fillblank" class="content-area" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <span class="category-badge" id="fb-level"></span>
                    <div class="progress-bar" style="width: 100px; margin: 0;">
                        <div class="progress-fill" id="fb-progress" style="width: 0%"></div>
                    </div>
                </div>
                
                <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                    <div class="sentence-container" id="fb-sentence"></div>
                </div>
                
                <div class="word-options" id="fb-options"></div>
                
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="checkFillBlank()">✓ Check Answer</button>
                    <button class="btn btn-primary" onclick="nextFillBlank()">Next ➡️</button>
                </div>
                
                <div class="feedback" id="fb-feedback"></div>
            </div>
        </div>

        <!-- Build Sentence -->
        <div id="build" class="content-area" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <span class="category-badge" id="bs-level"></span>
                    <div class="progress-bar" style="width: 100px; margin: 0;">
                        <div class="progress-fill" id="bs-progress" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="target-sentence" id="bs-target"></div>
                
                <div style="flex: 1;">
                    <div class="building-area" id="bs-area">
                        <div class="placeholder-text">Tap words below to build the sentence</div>
                    </div>
                </div>
                
                <div class="word-options" id="bs-options"></div>
                
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="clearSentence()">🔄 Clear</button>
                    <button class="btn btn-secondary" onclick="checkSentence()">✓ Check</button>
                    <button class="btn btn-primary" onclick="nextBuildSentence()">Next ➡️</button>
                </div>
                
                <div class="feedback" id="bs-feedback"></div>
            </div>
        </div>

        <!-- Quiz -->
        <div id="quiz" class="content-area" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <span class="category-badge" id="q-level"></span>
                    <div class="progress-bar" style="width: 100px; margin: 0;">
                        <div class="progress-fill" id="q-progress" style="width: 0%"></div>
                    </div>
                </div>
                
                <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                    <div class="word-main" id="q-word"></div>
                </div>
                
                <div class="quiz-options" id="q-options"></div>
                
                <div class="btn-group" id="q-next-container" style="display: none;">
                    <button class="btn btn-primary" onclick="nextQuiz()" id="q-next">Next ➡️</button>
                </div>
            </div>
        </div>
    </div>

        // Message display system
        let messageTimeout;
        
        function showFlirtyMessage(type, duration = 5000) {
            const messages = flirtyMessages[type];
            if (!messages || messages.length === 0) return;
            
            const message = messages[Math.floor(Math.random() * messages.length)];
            const messageBox = document.getElementById('flirty-message');
            
            if (messageBox) {
                clearTimeout(messageTimeout);
                messageBox.textContent = message;
                messageBox.classList.add('show');
                
                messageTimeout = setTimeout(() => {
                    messageBox.classList.remove('show');
                }, duration);
            }
        }

        // Check if user missed a day
        function checkLastVisit() {
            const lastVisit = localStorage.getItem('lastVisit');
            const today = new Date().toDateString();
            const sessionCount = parseInt(localStorage.getItem('sessionCount') || '0');
            
            if (lastVisit && lastVisit !== today) {
                const lastDate = new Date(lastVisit);
                const currentDate = new Date();
                const diffTime = Math.abs(currentDate - lastDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays >= 1) {
                    setTimeout(() => showFlirtyMessage('missedDay', 6000), 1000);
                }
            } else if (!lastVisit || sessionCount === 0) {
                // First time visitor
                setTimeout(() => showFlirtyMessage('firstTime', 6000), 500);
            } else {
                // Same day visit
                setTimeout(() => showFlirtyMessage('welcome', 5000), 500);
            }
            
            localStorage.setItem('lastVisit', today);
            localStorage.setItem('sessionCount', (sessionCount + 1).toString());
        }

        // Check time of day for special messages
        function checkTimeOfDay() {
            const hour = new Date().getHours();
            if (hour >= 22 || hour <= 5) {
                setTimeout(() => showFlirtyMessage('nightTime', 5000), 10000);
            } else if (hour >= 6 && hour <= 11) {
                setTimeout(() => showFlirtyMessage('morningTime', 5000), 8000);
            }
        }
        
        // Track session length
        let sessionStartTime = Date.now();
        setInterval(() => {
            const sessionLength = (Date.now() - sessionStartTime) / 1000 / 60; // minutes
            if (sessionLength > 10 && sessionLength % 10 < 0.1) {
                showFlirtyMessage('longSession', 5000);
            }
        }, 60000);

        // State
        let state = {
            currentFlashcard: 0,
            currentFillBlank: 0,
            currentBuildSentence: 0,
            currentQuiz: 0,
            score: 0,
            streak: 0,
            fillBlankAnswer: null,
            quizAnswered: false,
            builtWords: [],
            correctAnswersInSession: 0
        };

        // Load data - Now using embedded data!
        async function loadData() {
            // Data is already loaded from embedded source!
            console.log('Using embedded vocabulary data');
            // Vocabulary data already embedded above!
            
            // Initialize filtered data
            applyLevelFilter();
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('flashcards').classList.add('active');
            document.getElementById('flashcards').style.display = 'block';
            
            updateStats();
            loadFlashcard();
            
            // Check last visit and show welcome message
            checkLastVisit();
            checkTimeOfDay();
        }
        
        // Embedded data as fallback
        function loadEmbeddedData() {
            // This will be populated with the actual data
            fetch('comprehensive_vocabulary.json')
                .then(r => r.json())
                .then(data => {
                    vocabulary = data.vocabulary;
                    fillBlanks = data.fillBlanks;
                    buildSentences = data.buildSentences;
                })
                .catch(err => {
                    // If both fail, show basic demo data
                    vocabulary = [
                        {"word": "hello", "translation": "merhaba", "type": "interjection", "category": "Greetings", "example": "Hello, how are you?", "level": "A1"},
                        {"word": "goodbye", "translation": "hoşça kal", "type": "interjection", "category": "Greetings", "example": "Goodbye, see you later!", "level": "A1"},
                        {"word": "thank you", "translation": "teşekkür ederim", "type": "phrase", "category": "Greetings", "example": "Thank you for your help!", "level": "A1"}
                    ];
                    fillBlanks = [
                        {"sentence": "I say ___ when I meet someone.", "answer": "hello", "options": ["hello", "goodbye", "sorry", "please"], "level": "A1"}
                    ];
                    buildSentences = [
                        {"target": "Hello how are you", "words": ["Hello", "how", "are", "you", "goodbye", "I"], "level": "A1"}
                    ];
                    console.warn('Using demo data. Please ensure comprehensive_vocabulary.json is available.');
                });
        }

        function applyLevelFilter() {
            if (currentLevel === 'ALL') {
                filteredVocabulary = vocabulary;
                filteredFillBlanks = fillBlanks;
                filteredBuildSentences = buildSentences;
            } else {
                filteredVocabulary = vocabulary.filter(w => w.level === currentLevel);
                filteredFillBlanks = fillBlanks.filter(fb => fb.level === currentLevel);
                filteredBuildSentences = buildSentences.filter(bs => bs.level === currentLevel);
            }
            
            // Reset indices
            state.currentFlashcard = 0;
            state.currentFillBlank = 0;
            state.currentBuildSentence = 0;
            state.currentQuiz = 0;
        }

        function filterLevel(level) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            applyLevelFilter();
            
            // Reload current view
            const activeTab = document.querySelector('.tab-btn.active').textContent;
            if (activeTab.includes('Flashcards')) loadFlashcard();
            else if (activeTab.includes('Fill')) loadFillBlank();
            else if (activeTab.includes('Build')) loadBuildSentence();
            else if (activeTab.includes('Quiz')) loadQuiz();
        }

        function updateStats() {
            document.getElementById('totalWords').textContent = vocabulary.length;
            document.getElementById('score').textContent = state.score;
            document.getElementById('streak').textContent = state.streak;
        }

        function switchTab(tab) {
            document.querySelectorAll('.content-area').forEach(area => area.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tab).classList.add('active');
            document.getElementById(tab).style.display = 'block';
            event.target.classList.add('active');

            if (tab === 'fillblank') loadFillBlank();
            if (tab === 'build') loadBuildSentence();
            if (tab === 'quiz') loadQuiz();
        }

        // Flashcards
        function loadFlashcard() {
            if (filteredVocabulary.length === 0) return;
            const word = filteredVocabulary[state.currentFlashcard % filteredVocabulary.length];
            document.getElementById('fc-category').textContent = word.category;
            document.getElementById('fc-type').textContent = word.type;
            document.getElementById('fc-word').textContent = word.word;
            document.getElementById('fc-translation').textContent = word.translation;
            document.getElementById('fc-example').textContent = word.example;
            document.getElementById('fc-translation').classList.remove('show');
        }

        function showTranslation() {
            document.getElementById('fc-translation').classList.add('show');
        }

        function nextFlashcard() {
            state.currentFlashcard = (state.currentFlashcard + 1) % filteredVocabulary.length;
            loadFlashcard();
        }

        // Fill in the Blank
        function loadFillBlank() {
            if (filteredFillBlanks.length === 0) {
                document.getElementById('fb-sentence').innerHTML = '<p style="color: #ff6b6b;">No exercises available for this level.</p>';
                return;
            }
            
            state.fillBlankAnswer = null;
            document.getElementById('fb-feedback').classList.remove('show');
            
            const exercise = filteredFillBlanks[state.currentFillBlank % filteredFillBlanks.length];
            const progress = ((state.currentFillBlank / filteredFillBlanks.length) * 100).toFixed(0);
            document.getElementById('fb-progress').style.width = progress + '%';
            document.getElementById('fb-level').textContent = `${exercise.level} - ${state.currentFillBlank + 1}/${filteredFillBlanks.length}`;
            
            const parts = exercise.sentence.split('___');
            const sentenceHTML = `${parts[0]}<span class="blank" onclick="selectBlank(this)">${state.fillBlankAnswer || '___'}</span>${parts[1] || ''}`;
            document.getElementById('fb-sentence').innerHTML = sentenceHTML;
            
            const optionsHTML = exercise.options.map(opt => 
                `<div class="word-chip" onclick="selectOption(this, '${opt}')">${opt}</div>`
            ).join('');
            document.getElementById('fb-options').innerHTML = optionsHTML;
        }

        function selectOption(element, word) {
            document.querySelectorAll('#fb-options .word-chip').forEach(chip => chip.classList.remove('selected'));
            element.classList.add('selected');
            state.fillBlankAnswer = word;
            
            const blank = document.querySelector('#fb-sentence .blank');
            blank.textContent = word;
            blank.classList.add('filled');
        }

        function selectBlank(element) {}

        function checkFillBlank() {
            if (!state.fillBlankAnswer || filteredFillBlanks.length === 0) return;
            
            const exercise = filteredFillBlanks[state.currentFillBlank % filteredFillBlanks.length];
            const blank = document.querySelector('#fb-sentence .blank');
            const feedback = document.getElementById('fb-feedback');
            
            if (state.fillBlankAnswer === exercise.answer) {
                blank.classList.add('correct');
                blank.classList.remove('wrong');
                feedback.textContent = '🎉 Correct! Great job!';
                feedback.style.background = 'linear-gradient(135deg, #E8F5E9, #C8E6C9)';
                feedback.style.color = '#2E7D32';
                state.score += 10;
                state.streak += 1;
                state.correctAnswersInSession += 1;
                
                // Show flirty message after correct answer
                setTimeout(() => showFlirtyMessage('afterCorrect', 4000), 1000);
                
                // Check for high score
                if (state.correctAnswersInSession > 0 && state.correctAnswersInSession % 5 === 0) {
                    setTimeout(() => showFlirtyMessage('highScore', 5000), 6000);
                }
            } else {
                blank.classList.add('wrong');
                blank.classList.remove('correct');
                feedback.textContent = `❌ Wrong! The answer is "${exercise.answer}"`;
                feedback.style.background = 'linear-gradient(135deg, #FFEBEE, #FFCDD2)';
                feedback.style.color = '#C62828';
                state.streak = 0;
                
                // Show encouraging message after wrong answer
                setTimeout(() => showFlirtyMessage('afterWrong', 4000), 1000);
            }
            
            feedback.classList.add('show');
            updateStats();
        }

        function nextFillBlank() {
            state.currentFillBlank = (state.currentFillBlank + 1) % filteredFillBlanks.length;
            loadFillBlank();
        }

        // Build Sentence
        function loadBuildSentence() {
            if (filteredBuildSentences.length === 0) {
                document.getElementById('bs-target').innerHTML = 'No exercises available for this level.';
                return;
            }
            
            state.builtWords = [];
            document.getElementById('bs-feedback').classList.remove('show');
            
            const exercise = filteredBuildSentences[state.currentBuildSentence % filteredBuildSentences.length];
            const progress = ((state.currentBuildSentence / filteredBuildSentences.length) * 100).toFixed(0);
            document.getElementById('bs-progress').style.width = progress + '%';
            document.getElementById('bs-level').textContent = `${exercise.level} - ${state.currentBuildSentence + 1}/${filteredBuildSentences.length}`;
            document.getElementById('bs-target').textContent = exercise.target;
            
            const buildingArea = document.getElementById('bs-area');
            buildingArea.innerHTML = '<div class="placeholder-text">Tap words below to build the sentence</div>';
            buildingArea.classList.remove('has-words');
            
            const optionsHTML = exercise.words.map((word, idx) => 
                `<div class="word-chip" data-word="${word}" data-idx="${idx}" onclick="addWordToSentence(this)">${word}</div>`
            ).join('');
            document.getElementById('bs-options').innerHTML = optionsHTML;
        }

        function addWordToSentence(element) {
            if (element.classList.contains('used')) return;
            
            const word = element.dataset.word;
            const idx = element.dataset.idx;
            
            state.builtWords.push({ word, idx });
            element.classList.add('used');
            
            const buildingArea = document.getElementById('bs-area');
            
            if (state.builtWords.length === 1) {
                buildingArea.innerHTML = '';
                buildingArea.classList.add('has-words');
            }
            
            const chip = document.createElement('div');
            chip.className = 'word-chip';
            chip.textContent = word;
            chip.onclick = () => removeWordFromSentence(chip, idx);
            buildingArea.appendChild(chip);
        }

        function removeWordFromSentence(chip, idx) {
            state.builtWords = state.builtWords.filter(w => w.idx !== idx);
            chip.remove();
            
            const option = document.querySelector(`#bs-options .word-chip[data-idx="${idx}"]`);
            option.classList.remove('used');
            
            const buildingArea = document.getElementById('bs-area');
            if (state.builtWords.length === 0) {
                buildingArea.innerHTML = '<div class="placeholder-text">Tap words below to build the sentence</div>';
                buildingArea.classList.remove('has-words');
            }
        }

        function clearSentence() {
            state.builtWords = [];
            document.querySelectorAll('#bs-options .word-chip').forEach(chip => chip.classList.remove('used'));
            const buildingArea = document.getElementById('bs-area');
            buildingArea.innerHTML = '<div class="placeholder-text">Tap words below to build the sentence</div>';
            buildingArea.classList.remove('has-words');
        }

        function checkSentence() {
            if (state.builtWords.length === 0 || filteredBuildSentences.length === 0) return;
            
            const exercise = filteredBuildSentences[state.currentBuildSentence % filteredBuildSentences.length];
            const built = state.builtWords.map(w => w.word).join(' ');
            const feedback = document.getElementById('bs-feedback');
            
            if (built === exercise.target) {
                feedback.textContent = '🎉 Perfect! You built the sentence correctly!';
                feedback.style.background = 'linear-gradient(135deg, #E8F5E9, #C8E6C9)';
                feedback.style.color = '#2E7D32';
                state.score += 15;
                state.streak += 1;
                state.correctAnswersInSession += 1;
                
                // Show flirty message
                setTimeout(() => showFlirtyMessage('afterCorrect', 4000), 1000);
                
                if (state.correctAnswersInSession > 0 && state.correctAnswersInSession % 5 === 0) {
                    setTimeout(() => showFlirtyMessage('celebration', 5000), 6000);
                }
            } else {
                feedback.textContent = `❌ Not quite right. The correct sentence is: "${exercise.target}"`;
                feedback.style.background = 'linear-gradient(135deg, #FFEBEE, #FFCDD2)';
                feedback.style.color = '#C62828';
                state.streak = 0;
                
                setTimeout(() => showFlirtyMessage('afterWrong', 4000), 1000);
            }
            
            feedback.classList.add('show');
            updateStats();
        }

        function nextBuildSentence() {
            state.currentBuildSentence = (state.currentBuildSentence + 1) % filteredBuildSentences.length;
            loadBuildSentence();
        }

        // Quiz
        function loadQuiz() {
            if (filteredVocabulary.length === 0) return;
            
            state.quizAnswered = false;
            document.getElementById('q-next-container').style.display = 'none';
            
            const word = filteredVocabulary[state.currentQuiz % filteredVocabulary.length];
            const progress = ((state.currentQuiz / filteredVocabulary.length) * 100).toFixed(0);
            document.getElementById('q-progress').style.width = progress + '%';
            document.getElementById('q-level').textContent = `${word.level} - ${state.currentQuiz + 1}/${filteredVocabulary.length}`;
            document.getElementById('q-word').textContent = word.word;
            
            const options = [word.translation];
            const sameLevelWords = filteredVocabulary.filter(w => w.word !== word.word);
            while (options.length < 4 && sameLevelWords.length >= 3) {
                const randomWord = sameLevelWords[Math.floor(Math.random() * sameLevelWords.length)];
                if (!options.includes(randomWord.translation)) {
                    options.push(randomWord.translation);
                }
            }
            options.sort(() => Math.random() - 0.5);
            
            const optionsHTML = options.map(opt => 
                `<div class="quiz-option" onclick="checkQuizAnswer(this, '${opt}', '${word.translation}')">${opt}</div>`
            ).join('');
            document.getElementById('q-options').innerHTML = optionsHTML;
        }

        function checkQuizAnswer(element, selected, correct) {
            if (state.quizAnswered) return;
            
            state.quizAnswered = true;
            
            if (selected === correct) {
                element.classList.add('correct');
                state.score += 10;
                state.streak += 1;
                state.correctAnswersInSession += 1;
                
                setTimeout(() => showFlirtyMessage('afterCorrect', 4000), 800);
                
                if (state.streak >= 5) {
                    setTimeout(() => showFlirtyMessage('highScore', 5000), 5000);
                }
            } else {
                element.classList.add('wrong');
                document.querySelectorAll('.quiz-option').forEach(opt => {
                    if (opt.textContent === correct) {
                        opt.classList.add('correct');
                    }
                });
                state.streak = 0;
                
                setTimeout(() => showFlirtyMessage('afterWrong', 4000), 800);
            }
            
            updateStats();
            document.getElementById('q-next-container').style.display = 'flex';
        }

        function nextQuiz() {
            state.currentQuiz = (state.currentQuiz + 1) % filteredVocabulary.length;
            loadQuiz();
        }

        // Initialize
        loadData();
        
        // Show encouragement messages periodically
        setInterval(() => {
            if (Math.random() < 0.3) { // 30% chance every interval
                showFlirtyMessage('encouragement', 5000);
            }
        }, 60000); // Every minute
    </script>
